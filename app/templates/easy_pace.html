{% extends "base.html" %}


{% block body %}

  <div class="max-w-md mx-auto bg-white shadow-md rounded-xl p-6 space-y-6">
    <!-- Form -->
    <form id="fivekm-pb" class="space-y-4">
      <div>
        <label for="min" class="block text-sm font-medium text-gray-700">Minutes</label>
        <input type="text" id="min" name="min" autocomplete="off"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
      </div>

      <div>
        <label for="sec" class="block text-sm font-medium text-gray-700">Seconds</label>
        <input type="text" id="sec" name="sec" autocomplete="off"
              class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
      </div>
    </form>

    <!-- Buttons -->
    <div class="flex space-x-3">
      <button type="button" id="calc_btn" onclick="submit_pb()"
              class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition">
        Calculate
      </button>
      <button type="button" id="save_pb_btn" onclick="save_pb()"
              class="px-4 py-2 rounded-lg bg-green-600 text-white hover:bg-green-700 transition">
        Save as PB
      </button>
    </div>

    <!-- Units -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Units</label>
      <div class="flex space-x-3">
        <button type="button" id="km_btn" onclick="adjust_units_buttons('km')"
                class="px-4 py-2 rounded-lg text-white hover:bg-orange-700 transition"
                style="background-color: rgb(178, 97, 72)"
        >
          km
        </button>
        <button type="button" id="miles_btn" onclick="adjust_units_buttons('mile')"
                class="px-4 py-2 rounded-lg bg-orange-600 text-gray-800 hover:bg-gray-300 transition">
          miles
        </button>
      </div>
    </div>

    <!-- Results -->
    <div class="border-t pt-4 space-y-2">
      <h3 id="easy-pace-label" class="text-gray-800 font-semibold">Easy:</h3>
      <h3 id="tempo-pace-label" class="text-gray-800 font-semibold">Tempo:</h3>
      <h3 id="10k-pace-label" class="text-gray-800 font-semibold">10k:</h3>
      <h3 id="easy-pace-range-label" class="text-gray-800 font-semibold">Easy range:</h3>
    </div>
  </div>


{% endblock %}
