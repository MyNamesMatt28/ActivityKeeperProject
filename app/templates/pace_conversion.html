{% extends "base.html" %}


{% block body %}

  <div class="max-w-lg mx-auto bg-white shadow-md rounded-xl p-6 space-y-6">
    
    <!-- Toggle buttons -->
    <div class="flex space-x-3">
      <button type="button" id="pace_btn" onclick="adjust_pace_buttons('pace')"
              class="px-4 py-2 rounded-lg bg-gray-200 text-gray-800 hover:bg-gray-300 transition">
        Pace
      </button>
      <button type="button" id="dist_btn" onclick="adjust_pace_buttons('dist')"
              class="px-4 py-2 rounded-lg bg-gray-200 text-gray-800 hover:bg-gray-300 transition">
        Distance
      </button>
      <button type="button" id="time_btn" onclick="adjust_pace_buttons('time')"
              class="px-4 py-2 rounded-lg bg-gray-200 text-gray-800 hover:bg-gray-300 transition">
        Time
      </button>
    </div>

    <!-- Form -->
    <form id="pace-conv-form" class="space-y-6">

      <!-- Time fields -->
      <div id="time_div" hidden>
        <label for="time" id="time-label" class="block text-sm font-medium text-gray-700 mb-2">Time</label>
        <div class="grid grid-cols-3 gap-4">
          <div>
            <label for="time_hr_inp" class="block text-xs font-medium text-gray-500">Hours</label>
            <input type="text" id="time_hr_inp" name="hr" autocomplete="off"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
          </div>
          <div>
            <label for="time_min_inp" class="block text-xs font-medium text-gray-500">Minutes</label>
            <input type="text" id="time_min_inp" name="min" autocomplete="off"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
          </div>
          <div>
            <label for="time_sec_inp" class="block text-xs font-medium text-gray-500">Seconds</label>
            <input type="text" id="time_sec_inp" name="sec" autocomplete="off"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
          </div>
        </div>
      </div>

      <!-- Distance field -->
      <div id="dist_div" hidden>
        <label for="dist_inp" id="dist-label" class="block text-sm font-medium text-gray-700 mb-2">Distance (km)</label>
        <input type="text" id="dist_inp" name="dist" autocomplete="off"
              class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
      </div>

      <!-- Pace fields -->
      <div id="pace_div" hidden>
        <label for="pace" id="pace-label" class="block text-sm font-medium text-gray-700 mb-2">Pace</label>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="pace_min_inp" class="block text-xs font-medium text-gray-500">Minutes</label>
            <input type="text" id="pace_min_inp" name="min" autocomplete="off"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
          </div>
          <div>
            <label for="pace_sec_inp" class="block text-xs font-medium text-gray-500">Seconds</label>
            <input type="text" id="pace_sec_inp" name="sec" autocomplete="off"
                  class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
          </div>
        </div>
      </div>

      <!-- Labels (hidden by default) -->
      <div>
        <label hidden id="pace_lbl" class="font-medium">Pace:</label>
        <label hidden id="dist_lbl" class="font-medium">Distance:</label>
        <label hidden id="time_lbl" class="font-medium">Time:</label>
      </div>

      <!-- Calculate button -->
      <div>
        <button type="button" id="conv_btn" onclick="submit_conversion()"
                class="w-full px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 transition">
          Calculate
        </button>
      </div>

    </form>
  </div>

{% endblock %}
